<!doctype html>
<html lang="es-AR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleter · Panel de empresa (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500&family=Josefin+Sans:wght@600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens: mismos valores que src/theme.js (sistema v2 "Fleter") ───────── */
:root{
  --bg:#FAF7F1; --surface:#FFFFFF; --surface2:#F2EDE2; --surface3:#ECE9E1;
  --line:#E8E4DA; --line-strong:#D9D3C5;
  --ink:#1B1A17; --ink2:#3F3B34; --ink3:#665F50; --ink4:#B8B2A2; --on-ink:#FFFFFF;
  --accent:#E85D2A; --accent-press:#D2521F; --accent-ink:#A63B14; --accent-soft:#FBE4D6; --accent-softer:#FFF1E7;
  --on-accent:#1B1A17; --on-accent-large:#FFFFFF;
  --ok:#2F8F4E; --ok-ink:#1F6B39; --ok-soft:#DCEFD8;
  --warn:#C98A12; --warn-ink:#8A5E0B; --warn-soft:#FBEFCE;
  --err:#B83232; --err-ink:#9C2626; --err-soft:#F5D9D4;
  --info:#2E6FB7; --info-ink:#22578F; --info-soft:#D8E4F2;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --f-display:'Archivo Black','Arial Black',system-ui,sans-serif;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-accent:'Josefin Sans','Manrope',system-ui,sans-serif;
  --shadow-pop:0 12px 32px rgba(27,26,23,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141310; --surface:#1C1A16; --surface2:#23201B; --surface3:#2B2822;
  --line:#2E2A24; --line-strong:#3B362E;
  --ink:#F4F0E7; --ink2:#CBC5B8; --ink3:#9E978A; --ink4:#6B655A; --on-ink:#141310;
  --accent-ink:#F0865A; --accent-soft:#3B2116; --accent-softer:#2A1B13;
  --ok:#4DB36E; --ok-ink:#7BD397; --ok-soft:#16301F;
  --warn:#D9A23A; --warn-ink:#E9BC5C; --warn-soft:#33260A;
  --err:#D95454; --err-ink:#F09090; --err-soft:#3A1717;
  --info:#5C93D6; --info-ink:#8DB8EC; --info-soft:#14243A;
  --shadow-pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.patente{font-family:var(--f-mono);letter-spacing:.08em}
.muted{color:var(--ink3)}
.eyebrow{font-family:var(--f-accent);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--accent-ink)}
.display{font-family:var(--f-display);letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Botones ───────────────────────────────────────────────────────────── */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;cursor:pointer;background:transparent;white-space:nowrap;transition:background .12s}
.btn-lg{height:44px}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-press)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ghost{border-color:var(--line-strong);background:var(--surface)}
.btn-ghost:hover{background:var(--surface3)}
.btn-danger{border-color:var(--err);color:var(--err-ink);background:transparent}
.btn-danger:hover{background:var(--err-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Formularios ───────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.input,.select,.textarea{height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);width:100%;min-width:0}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm,.select.sm{height:36px}
.hint{font-size:12px;color:var(--ink3)}
.err-text{font-size:12px;color:var(--err-ink);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ── Cards, badges, tags ───────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px}
.card.ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.card h3{font-family:var(--f-display);font-size:14px;letter-spacing:-.01em;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-sm);font-size:11px;font-weight:700;white-space:nowrap}
.b-info{background:var(--info-soft);color:var(--info-ink)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink)}
.b-ok{background:var(--ok-soft);color:var(--ok-ink)}
.b-err{background:var(--err-soft);color:var(--err-ink)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink)}
.b-neutral{background:var(--surface2);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.tag{display:inline-block;padding:2px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:700;background:var(--surface2);color:var(--ink2);margin:0 4px 4px 0}
.tag.FRAGIL{background:var(--warn-soft);color:var(--warn-ink)}
.tag.REFRIGERADO{background:var(--info-soft);color:var(--info-ink)}
.tag.PELIGROSO{background:var(--err-soft);color:var(--err-ink)}
.chipbtn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.optcard{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;text-align:left;flex:1;min-width:150px}
.optcard b{display:block;font-size:14px}
.optcard span{font-size:12px;color:var(--ink3)}
.optcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note{border-radius:var(--r-md);padding:10px 14px;font-size:13px;font-weight:500}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.err{background:var(--err-soft);color:var(--err-ink)}
.note.info{background:var(--info-soft);color:var(--info-ink)}
.note.ok{background:var(--ok-soft);color:var(--ok-ink)}

/* ── Shell ─────────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .wm{font-family:var(--f-display);font-size:22px;letter-spacing:-.03em}
.brand .wm i{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:4px;flex:1}
.tab{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-md);text-decoration:none;font-weight:500;color:var(--ink2);position:relative}
.tab:hover{background:var(--surface3)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:3px;background:var(--accent);border-radius:3px}
.tab.cta{background:var(--accent);color:var(--on-accent);font-weight:700}
.tab.cta:hover{background:var(--accent-press)}
.tab.cta[aria-current="page"]::after{display:none}
.userbox{display:flex;align-items:center;gap:12px;position:relative}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;border:0}
.menu{position:absolute;right:0;top:46px;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:14px;z-index:30}
.seg{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;height:30px;border-radius:5px;font-weight:600;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.main{max-width:1320px;margin:0 auto;padding:28px 24px 96px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em;line-height:1.1}
.foot{max-width:1320px;margin:0 auto;padding:0 24px 32px;color:var(--ink3);font-size:12px}

/* ── Calendario ────────────────────────────────────────────────────────── */
.calbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.calbar .title{font-family:var(--f-display);font-size:20px;min-width:200px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.month{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.month-head,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.month-head div{padding:10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--surface2);border-bottom:1px solid var(--line)}
.cell{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--bg)}
.cell.out .dn{color:var(--ink4)}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--ink2);display:flex;justify-content:space-between}
.cell.today .dn b{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px}
.vchip{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:var(--r-sm);padding:4px 6px;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.3;overflow-wrap:anywhere}
.vchip .t{font-family:var(--f-mono);font-weight:500}
.vchip.b-info{border-color:var(--info)}
.vchip.b-acc{border-color:var(--accent)}
.vchip.b-ok{border-color:var(--ok)}
.vchip.b-err{border-color:var(--err);text-decoration:line-through;opacity:.8}
.vchip.flash{animation:flash 2.4s ease-out 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.more{font-size:11.5px;font-weight:700;color:var(--accent-ink);background:none;border:0;text-align:left;padding:2px 4px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;min-height:260px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wcol.today{border-color:var(--accent)}
.wcol h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);display:flex;justify-content:space-between}
.wcard{text-align:left;border:1px solid var(--line);border-left:3px solid;background:var(--surface);border-radius:var(--r-sm);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.wcard.b-info{border-left-color:var(--info)}.wcard.b-acc{border-left-color:var(--accent)}.wcard.b-ok{border-left-color:var(--ok)}.wcard.b-err{border-left-color:var(--err)}
.wcard{background:var(--surface);color:var(--ink)}
.wcard:hover{background:var(--surface2)}
.wcard .t{font-family:var(--f-mono);font-size:12px;font-weight:500}
.wcard .r{font-size:12.5px;font-weight:600}
.wcard .s{font-size:11.5px;color:var(--ink3)}

/* ── Tabla ─────────────────────────────────────────────────────────────── */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .input,.filters .select{width:auto;min-width:160px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.twrap{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:auto;max-height:calc(100vh - 330px);min-height:260px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
th button:hover{color:var(--ink)}
th[aria-sort="ascending"] button,th[aria-sort="descending"] button{color:var(--ink)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-softer)}
td.num,th.num{text-align:right}
td.stick,th.stick{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line)}
th.stick{background:var(--surface2);z-index:3}
tbody tr:hover td.stick{background:var(--accent-softer)}
.price{font-family:var(--f-display);font-size:14px;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--ink3)}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;border-top:1px solid var(--line-strong)}
.empty{padding:48px 16px;text-align:center}
.empty h3{font-family:var(--f-display);font-size:17px;margin-bottom:6px}

/* ── Detalle ───────────────────────────────────────────────────────────── */
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.dl dt{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:2px}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.bigprice{font-family:var(--f-display);font-size:44px;letter-spacing:-.03em;line-height:1}
.route{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.route::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--line-strong)}
.route li{list-style:none;position:relative}
.route li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;background:var(--ink3);border-radius:50%;border:2px solid var(--surface)}
.route li.o::before{background:var(--accent)}
.route li.d::before{background:var(--ink);border-radius:2px}
.route{margin:0;padding-top:0}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.tl li{display:flex;gap:12px;padding:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .pt{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);margin-top:3px;flex:none;z-index:1}
.tl li.done .pt{background:var(--ok);border-color:var(--ok)}
.tl li.now .pt{background:var(--accent);border-color:var(--accent);animation:pulse 1.4s infinite}
.tl li.bad .pt{background:var(--err);border-color:var(--err)}
.tl .tt{font-weight:600}
.tl li:not(.done):not(.now):not(.bad) .tt{color:var(--ink3);font-weight:500}
.tl .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.mapbox{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface2)}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{padding:8px 12px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface)}
.sim{border:2px dashed var(--line-strong);border-radius:var(--r-md);padding:16px;background:var(--surface)}
.sim .eyebrow{color:var(--ink3)}
.audit{display:flex;flex-direction:column;gap:10px;font-size:13px}
.audit .t{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)}
.cmp{width:100%;min-width:0}
.cmp th{position:static;background:transparent;padding:6px 8px 6px 0}
.cmp td{padding:8px 8px 8px 0}

/* ── Fleteros ──────────────────────────────────────────────────────────── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left}
.fcard:hover{border-color:var(--line-strong);background:var(--accent-softer)}
.fhead{display:flex;gap:12px;align-items:center}
.fav{width:42px;height:42px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink2);flex:none}
.fname{font-family:var(--f-display);font-size:15px;letter-spacing:-.01em}
.codebox{font-family:var(--f-mono);font-size:28px;letter-spacing:.08em;text-align:center;padding:16px;background:var(--surface2);border-radius:var(--r-md);border:1px dashed var(--line-strong)}

/* ── Modal / toast ─────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(20,19,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;padding:22px;box-shadow:var(--shadow-pop);border:1px solid var(--line)}
.modal h2{font-family:var(--f-display);font-size:20px;margin-bottom:14px;letter-spacing:-.02em}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:var(--r-md);font-weight:600;box-shadow:var(--shadow-pop);max-width:90vw}
.toast.err{background:var(--err);color:#fff}

/* ── Login ─────────────────────────────────────────────────────────────── */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--ink);color:var(--on-ink);padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login-art .big{font-family:var(--f-display);font-size:44px;line-height:1.05;letter-spacing:-.03em;max-width:520px}
.login-art .big i{font-style:normal;color:var(--accent)}
.login-art ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:var(--ink4);font-size:14px}
:root[data-theme="dark"] .login-art{background:var(--surface)}
.login-form{padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:0 auto;gap:16px}
.login-form h1{font-family:var(--f-display);font-size:26px;letter-spacing:-.02em}

/* ── Formulario Nuevo viaje ────────────────────────────────────────────── */
.formgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stops{display:flex;flex-direction:column;gap:10px}
.stoprow{display:flex;gap:8px;align-items:center}
.stoprow .mk{width:14px;height:14px;border-radius:50%;background:var(--ink3);flex:none}
.stoprow .mk.o{background:var(--accent)}
.stoprow .mk.d{background:var(--ink);border-radius:3px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chipbtn{width:38px;padding:0}
.sticky{position:sticky;top:84px}
.previewlist{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}

/* ── Responsive ────────────────────────────────────────────────────────── */
@media (max-width:1000px){
  .detail,.formgrid{grid-template-columns:1fr}
  .sticky{position:static}
  .week{grid-template-columns:1fr}
  .wcol{min-height:0}
}
@media (max-width:760px){
  .login{grid-template-columns:1fr}
  .login-art{display:none}
  .login-form{padding:32px 20px}
  .topbar-in{padding:0 16px;height:56px}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);height:64px;padding:6px 8px;justify-content:space-around;z-index:25}
  .tab{flex-direction:column;gap:2px;font-size:11px;height:52px;padding:0 8px;justify-content:center}
  .tab[aria-current="page"]::after{display:none}
  .tab[aria-current="page"]{color:var(--accent-ink)}
  .tab.cta{background:transparent;color:var(--accent-ink)}
  .tab.cta:hover{background:transparent}
  .userbox .who{display:none}
  .main{padding:20px 16px 96px}
  .grid2,.grid3,.dl{grid-template-columns:1fr}
  .cell{min-height:64px;padding:4px;cursor:pointer}
  .vchip{font-size:0;padding:0;height:7px;border:0;border-radius:4px}
  .vchip.b-info{background:var(--info)}.vchip.b-acc{background:var(--accent)}.vchip.b-ok{background:var(--ok)}.vchip.b-err{background:var(--err);text-decoration:none}
  .more{font-size:10px;padding:0}
  .pagehead h1{font-size:24px}
  .legend{margin-left:0}
  #toast{bottom:84px}
  .bigprice{font-size:36px}
}
</style>

function resolvePlace(txt) {

function repDates() {

  const max = f.fin === 'cantidad' ? Math.max(1, Math.min(60, Number(f.finN) || 1)) : 60;

    for (let d = startOfDay(first), guard = 0; all.length < max && guard < 900; d = addDays(d, 1), guard++) {

    }

    }

  let nota = '';
  if (all.length > dentro.length) nota = `Se crean ahora los primeros ${dentro.length} (90 días); el resto se genera solo a medida que se acerca.`;

// ── Mapa esquemático ───────────────────────────────────────────────────────
let MAPCTX = null;
function mapSVG(v) {

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático del recorrido">

    <rect width="${W}" height="${H}" fill="var(--surface2)"/><rect width="${W}" height="${H}" fill="url(#grid)"/>
    <polyline points="${line}" fill="none" stroke="var(--line-strong)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${v.estado === 'FINALIZADO' ? '0' : '2 7'}"/>
    ${xy.map((p, i) => i === 0 ? `<circle cx="${p.x}" cy="${p.y}" r="8" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>${lab(p, 'Origen · ' + P[i].loc.split(',')[0])}` : i === xy.length - 1 ? `<rect x="${p.x - 8}" y="${p.y - 8}" width="16" height="16" rx="3" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/>${lab(p, 'Destino · ' + P[i].loc.split(',')[0])}` : `<circle cx="${p.x}" cy="${p.y}" r="6" fill="var(--ink3)" stroke="var(--surface)" stroke-width="3"/>${lab(p, 'Parada ' + i)}`).join('')}

  </svg>`;
}

// ── Simulación del fletero (solo demo) ─────────────────────────────────────
function nextSim(v) {
  const P = pts(v), last = P.length - 1;
  if (v.estado === 'PROGRAMADO') return { label: 'Fletero inicia el viaje', hint: v.fletero ? 'En el producto real, el fletero toca “Iniciar viaje” en su app y arranca el GPS.' : 'Asigná un fletero primero.', off: !v.fletero };
  if (v.estado !== 'EN_CURSO') return null;
  if (v.etapa === 'EN_CAMINO_A_ORIGEN') return { label: 'Llega al origen y empieza a cargar', hint: 'El GPS lo ubica en el origen.' };
  if (v.etapa === 'CARGANDO') return { label: 'Termina de cargar y sale (confirma el origen)', hint: 'Confirma el origen por GPS y pasa a “En ruta”.' };
  if (v.etapa === 'EN_RUTA') { const i = v.conf.findIndex((c, ix) => ix > 0 && ix < last && !c); const pend = pendStop(v); return pend ? { label: `Confirma la parada ${pend} por GPS`, hint: 'Solo se acepta a menos de 50 m de la parada.' } : { label: 'Llega al destino y empieza a descargar', hint: 'Pasa a “Descargando”.' }; }
  if (v.etapa === 'DESCARGANDO') return { label: 'Confirma la entrega en destino por GPS', hint: 'Cierra el viaje como Finalizado.' };
  return null;
}
function pendStop(v) { const P = pts(v); for (let i = 1; i < P.length - 1; i++) if (!v.conf[i]) return i; return 0; }
function simPanel(v) {
  const n = nextSim(v);
  if (!n) return '';
  return `<div class="sim"><div class="eyebrow">Simulación · solo para la demo</div>
    <p class="hint" style="margin:6px 0 12px">En el producto real esto lo hace únicamente la app del fletero, con GPS. Acá podés recorrer el viaje paso a paso.</p>
    <button class="btn btn-primary" data-act="sim" data-id="${v.id}" ${n.off ? 'disabled' : ''}>${n.label}</button>
    <div class="hint" style="margin-top:8px">${n.hint}</div></div>`;
}
function animateTo(v, target, ms, done) {
  const from = { ...v.gps }, t0 = performance.now(); S.animando = true;
  const step = t => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    v.gps = { lat: from.lat + (target.lat - from.lat) * e, lng: from.lng + (target.lng - from.lng) * e }; v.gpsTs = Date.now();
    movePin(v);
    if (k < 1) requestAnimationFrame(step); else { S.animando = false; done && done(); }
  };
  requestAnimationFrame(step);
}
function simRun(v) {
  if (S.animando) return;
  const P = pts(v), last = P.length - 1, fl = F(v.fletero), now = new Date();
  const log = txt => v.audit.push({ t: now, who: fname(fl), txt });
  if (v.estado === 'PROGRAMADO') {
    if (!fl) return toast('Asigná un fletero antes: nadie puede iniciar este viaje.', 'err');
    v.estado = 'EN_CURSO'; v.etapa = 'EN_CAMINO_A_ORIGEN'; v.hist.EN_CAMINO_A_ORIGEN = now;
    v.gps = { lat: P[0].lat + 0.03, lng: P[0].lng - 0.035 }; v.gpsTs = Date.now(); log('Inició el viaje desde la app'); toast(`${fl.nombre} inició el viaje. Empieza el seguimiento por GPS.`); return render();
  }
  if (v.etapa === 'EN_CAMINO_A_ORIGEN') { animateTo(v, P[0], 1400, () => { v.etapa = 'CARGANDO'; v.hist.CARGANDO = new Date(); log('Llegó al origen y empezó a cargar'); render(); }); return rerenderSim(); }
  if (v.etapa === 'CARGANDO') { v.conf[0] = { t: now, dist: 8 + Math.round(Math.random() * 30) }; v.etapa = 'EN_RUTA'; v.hist.EN_RUTA = now; log(`Confirmó el origen por GPS (a ${v.conf[0].dist} m) y salió a ruta`); return render(); }
  if (v.etapa === 'EN_RUTA') {
    const i = pendStop(v);
    if (i) { animateTo(v, P[i], 1600, () => { v.conf[i] = { t: new Date(), dist: 6 + Math.round(Math.random() * 35) }; log(`Confirmó la parada ${i} por GPS (a ${v.conf[i].dist} m)`); render(); }); return rerenderSim(); }
    animateTo(v, P[last], 1600, () => { v.etapa = 'DESCARGANDO'; v.hist.DESCARGANDO = new Date(); log('Llegó al destino y empezó a descargar'); render(); }); return rerenderSim();
  }
  if (v.etapa === 'DESCARGANDO') {
    v.conf[last] = { t: now, dist: 5 + Math.round(Math.random() * 35) };
    v.estado = 'FINALIZADO'; v.etapa = null; v.cierre = 'GPS'; v.hist.FINALIZADO = now;
    v.real = { km: Math.round(v.km * (0.97 + Math.random() * 0.08) * 10) / 10, min: Math.round(v.min * (0.94 + Math.random() * 0.14)), precio: Math.round(v.precio * (0.97 + Math.random() * 0.07) / 50) * 50 };
    log(`Confirmó la entrega en destino por GPS (a ${v.conf[last].dist} m)`); toast(`Viaje ${vid(v)} finalizado con confirmación por GPS.`); return render();
  }
}
function rerenderSim() { const b = $('[data-act="sim"]'); if (b) { b.disabled = true; b.textContent = 'El fletero se está moviendo…'; } }
let ticker = null;
function startTicker(v) {
  clearInterval(ticker); if (!v || v.estado !== 'EN_CURSO') return;
  ticker = setInterval(() => {
    if (v.estado !== 'EN_CURSO') return clearInterval(ticker);
    if (!S.animando && Date.now() - v.gpsTs > 15000) { v.gpsTs = Date.now(); if (v.etapa === 'EN_RUTA') { v.gps = { lat: v.gps.lat + (Math.random() - .5) * 0.0006, lng: v.gps.lng + (Math.random() - .5) * 0.0006 }; movePin(v); } }
    const s = Math.max(0, Math.round((Date.now() - v.gpsTs) / 1000));
    const a = $('#lastsig'); if (a) a.textContent = `hace ${s} s`;
    const b = $('#vel'); if (b) b.textContent = v.etapa === 'EN_RUTA' ? `${38 + (Math.round(Date.now() / 3000) % 9)} km/h` : '0 km/h';
    const c = $('#gpsline'); if (c) c.textContent = `GPS del fletero · hace ${s} s`;
  }, 1000);
}

  openModal(`<h2>Agregar fletero</h2>
    <div class="seg" style="margin-bottom:16px"><button data-act="tab-add" data-v="code" aria-pressed="${tab === 'code'}">Código de un solo uso</button><button data-act="tab-add" data-v="mail" aria-pressed="${tab === 'mail'}">Invitar por email</button></div>
    ${tab === 'code' ? `<p class="muted" style="margin-top:0">Pasale este código al fletero. Lo ingresa en la app de Fleter, sirve una sola vez y vence solo.</p>
      <div class="codebox" id="codigo">${S.codigo.code}</div>
      <div class="sub" style="text-align:center;margin:8px 0 14px">Vence en ${Math.floor(rest / 60)} h ${rest % 60} min · ${fechaCorta(S.codigo.vence)} ${hhmm(S.codigo.vence)}</div>
      <div class="row" style="justify-content:center"><button class="btn btn-ink" data-act="copiar">Copiar código</button><button class="btn btn-ghost" data-act="nuevo-codigo">Generar otro</button></div>
      <div class="sim" style="margin-top:18px"><div class="eyebrow">Simulación · solo para la demo</div><p class="hint" style="margin:6px 0 10px">En el producto real el fletero ingresa el código en su app y queda esperando tu aprobación.</p><button class="btn btn-ghost btn-sm" data-act="sim-join">Un fletero ingresa el código</button></div>`
    : `<p class="muted" style="margin-top:0">Le mandamos un email con un código de un solo uso. Vence a las 72 horas.</p>
      <div class="field"><label class="label" for="inv">Email del fletero</label><input class="input" id="inv" type="email" placeholder="nombre@correo.com" autofocus></div><span class="err-text" id="e-inv"></span>
      <div class="actions"><button class="btn btn-primary" data-act="enviar-inv">Enviar invitación</button></div>`}
    <div class="actions" style="margin-top:8px"><button class="btn btn-ghost" data-act="modal-x">Cerrar</button></div>`);
}
function modalCancelar(v) {
  const s = S.series.find(x => x.id === v.serie);
  openModal(`<h2>Cancelar ${vid(v)}</h2>
    <p class="muted" style="margin-top:0">${fechaLarga(v.fecha)} · ${hhmm(v.fecha)} · ${esc(v.origen.loc)} → ${esc(v.destino.loc)}</p>
    ${v.estado === 'EN_CURSO' ? '<div class="note warn" style="margin-bottom:12px">El viaje ya está en curso: se avisa al fletero y se corta el seguimiento.</div>' : ''}
    <div class="field"><label class="label" for="motivo">Motivo</label><textarea class="textarea" id="motivo" autofocus placeholder="Ej.: el cliente reprogramó la entrega"></textarea><span class="err-text" id="e-motivo"></span></div>
    ${s ? `<div class="label" style="margin:14px 0 8px">Este viaje es parte de una serie (${esc(serieTxt(s))})</div>
      <label class="row" style="gap:8px;margin-bottom:6px"><input type="radio" name="alc" value="uno" checked> Solo este viaje</label>
      <label class="row" style="gap:8px;margin-bottom:6px"><input type="radio" name="alc" value="sig"> Este y los siguientes</label>
      <label class="row" style="gap:8px"><input type="radio" name="alc" value="todos"> Toda la serie (los viajes pendientes)</label>` : ''}
    <div class="actions"><button class="btn btn-ghost" data-act="modal-x">Volver</button><button class="btn btn-danger" data-act="confirmar-cancel" data-id="${v.id}">Cancelar viaje</button></div>`);
}

// ── Router / render ────────────────────────────────────────────────────────
function parseHash() {
  const h = (location.hash || '#/calendario').replace(/^#\/?/, '').split('/');
  const n = h[0] || 'calendario';
  if (n === 'viaje') return { name: 'viaje', id: h[1], tab: null };
  if (n === 'fletero') return { name: 'fletero', id: h[1], tab: 'fleteros' };
  return { name: ['nuevo', 'calendario', 'viajes', 'fleteros'].includes(n) ? n : 'calendario', tab: n };
}
let lastRoute = '';
function render() {
  const app = $('#app');
  document.documentElement.dataset.theme = S.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;
  if (!S.user) { app.innerHTML = loginView(); return; }
  const r = parseHash(), key = location.hash, y = window.scrollY;
  let body = '';
  clearInterval(ticker);
  if (r.name === 'nuevo') body = nuevoView();
  else if (r.name === 'calendario') { body = calView(); S.volver = '#/calendario'; }
  else if (r.name === 'viajes') { body = tablaView(); S.volver = '#/viajes'; }
  else if (r.name === 'fleteros') body = fleterosView();
  else if (r.name === 'viaje') body = detalleView(V(r.id));
  else if (r.name === 'fletero') body = fleteroDetalle(F(r.id));
  app.innerHTML = shell(r, body);
  if (r.name === 'nuevo') { $('#stops').innerHTML = stopsHtml(); refreshForm(); }
  if (r.name === 'viaje') startTicker(V(r.id));
  window.scrollTo(0, key === lastRoute ? y : 0); lastRoute = key;
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/nuevo')) { /* conserva el borrador solo mientras estás en el formulario */ } S.menu = false; render(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); if (S.menu) { S.menu = false; render(); } } if ((e.key === 'Enter') && e.target.matches('tr[data-act="open"]')) location.hash = '#/viaje/' + e.target.dataset.id; });

// ── Eventos ────────────────────────────────────────────────────────────────
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'login') { S.user = { nombre: 'Laura', apellido: 'Gómez' }; if (!location.hash || location.hash === '#/') location.hash = '#/calendario'; render(); }
  if (f === 'nuevo') submitNuevo();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.loc) { const f = S.form; if (t.dataset.loc === 'origen') f.origen = t.value; else if (t.dataset.loc === 'destino') f.destino = t.value; else f.paradas[+t.dataset.i] = t.value; refreshForm(); return; }
  if (t.dataset.f && S.form) { S.form[t.dataset.f] = t.type === 'number' ? t.value : t.value; if (['fecha', 'hora', 'fletero', 'diaMes', 'finN', 'finFecha'].includes(t.dataset.f)) refreshForm(); if (t.dataset.f === 'fin') { refreshForm(); } return; }
  if (t.dataset.bind === 't-q') { S.tabla.q = t.value; $('#tablaMount').innerHTML = tablaInner(); }
});
document.addEventListener('change', e => {
  const t = e.target, b = t.dataset.bind;
  if (t.dataset.f === 'fin' && S.form) { S.form.fin = t.value; refreshForm(); return; }
  if (!b) return;
  if (b === 'cal-fletero') { S.cal.fletero = t.value; render(); return; }
  if (b.startsWith('t-') && b !== 't-q') { const k = b.slice(2); S.tabla[k] = k === 'sin' ? t.checked : t.value; $('#tablaMount').innerHTML = tablaInner(); }
});
document.addEventListener('click', e => {
  if (S.menu && !e.target.closest('.userbox')) { S.menu = false; render(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  const H = {
    'modal-bg': () => { if (e.target === el) closeModal(); },
    'modal-x': closeModal,
    menu: () => { S.menu = !S.menu; render(); },
    theme: () => { S.theme = v; render(); },
    logout: () => { S.user = null; S.menu = false; location.hash = ''; render(); },
    open: () => { location.hash = '#/viaje/' + id; },
    // formulario
    'add-stop': () => { S.form.paradas.push(''); $('#stops').innerHTML = stopsHtml(); refreshForm(); const i = $$('#stops [data-loc="parada"]'); i[i.length - 1].focus(); },
    'del-stop': () => { S.form.paradas.splice(+el.dataset.i, 1); $('#stops').innerHTML = stopsHtml(); refreshForm(); },
    veh: () => { S.form.vehTipo = v; $$('#vehtipos .optcard').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); refreshForm(); },
    cond: () => { const c = S.form.cond; c.includes(v) ? c.splice(c.indexOf(v), 1) : c.push(v); el.setAttribute('aria-pressed', c.includes(v)); refreshForm(); },
    rep: () => { S.form.rep = v; $$('#reptype .chipbtn').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); if (v === 'SEMANAL' && !S.form.dias.length) S.form.dias = [new Date(S.form.fecha + 'T12:00').getDay()]; refreshForm(); },
    dia: () => { const d = S.form.dias, n = +v; d.includes(n) ? (d.length > 1 && d.splice(d.indexOf(n), 1)) : d.push(n); el.setAttribute('aria-pressed', d.includes(n)); refreshForm(); },
    // calendario
    'cal-modo': () => { S.cal.modo = v; render(); },
    'cal-prev': () => { const c = S.cal; c.ancla = c.modo === 'mes' ? new Date(c.ancla.getFullYear(), c.ancla.getMonth() - 1, 1) : addDays(c.ancla, -7); render(); },
    'cal-next': () => { const c = S.cal; c.ancla = c.modo === 'mes' ? new Date(c.ancla.getFullYear(), c.ancla.getMonth() + 1, 1) : addDays(c.ancla, 7); render(); },
    'cal-hoy': () => { S.cal.ancla = startOfDay(NOW); render(); },
    day: () => { if (el.classList.contains('cell') && innerWidth > 760) return; S.cal.modo = 'semana'; S.cal.ancla = new Date(el.dataset.d + 'T12:00'); render(); },
    // tabla
    sort: () => { const t = S.tabla, k = el.dataset.k; t.dir = t.sort === k ? -t.dir : 1; t.sort = k; $('#tablaMount').innerHTML = tablaInner(); },
    limpiar: () => { S.tabla = { ...S.tabla, estado: '', fletero: '', mes: '', q: '', sin: false }; render(); },
    csv,
    // detalle
    reasignar: () => { const x = V(id), sel = $('#reasig').value; if (!sel) return toast('Elegí un fletero.', 'err'); if (sel === x.fletero) return toast('Ese fletero ya está asignado.'); const cf = conflictos(sel, [x.fecha], x.min, x.id); const prev = x.fletero; x.fletero = sel; x.audit.push({ t: new Date(), who: 'Laura Gómez', txt: prev ? `Cambió el fletero: de ${fname(F(prev))} a ${fname(F(sel))}` : `Asignó a ${fname(F(sel))}` }); toast(cf.length ? `Asignado a ${fname(F(sel))}. Ojo: ya tiene ${cf[0].v.id ? vid(cf[0].v) : 'otro viaje'} en ese horario.` : `Ahora lo hace ${fname(F(sel))}.`); render(); },
    'cancelar-viaje': () => modalCancelar(V(id)),
    'confirmar-cancel': () => {
      const x = V(id), m = $('#motivo').value.trim(); if (m.length < 5) { $('#e-motivo').textContent = 'Contanos el motivo (mínimo 5 letras).'; return; }
      const alc = (document.querySelector('input[name="alc"]:checked') || {}).value || 'uno';
      let afect = [x];
      if (x.serie && alc !== 'uno') afect = S.viajes.filter(y => y.serie === x.serie && y.estado === 'PROGRAMADO' && (alc === 'todos' || y.fecha >= x.fecha)).concat(x.estado === 'EN_CURSO' ? [x] : []);
      afect = [...new Set(afect)];
      afect.forEach(y => { cancelar(y, m, 'Laura Gómez', new Date()); });
      closeModal(); toast(afect.length === 1 ? `${vid(x)} cancelado.` : `Se cancelaron ${afect.length} viajes de la serie.`); render();
    },
    remito: () => toast('En el producto real acá se abre el remito en PDF.'),
    sim: () => simRun(V(id)),
    // fleteros
    'add-fletero': () => modalAgregar('code'),
    'tab-add': () => modalAgregar(v),
    copiar: () => { navigator.clipboard ? navigator.clipboard.writeText(S.codigo.code).then(() => toast('Código copiado.'), () => toast('No pudimos copiarlo: seleccionalo a mano.', 'err')) : toast('No pudimos copiarlo: seleccionalo a mano.', 'err'); },
    'nuevo-codigo': () => { S.codigo = { code: genCode(), vence: plus(new Date(), 72 * 60) }; modalAgregar('code'); toast('Generamos un código nuevo. El anterior dejó de funcionar.'); },
    'sim-join': () => { const extra = [['Nicolás', 'Paredes'], ['Diego', 'Molina'], ['Facundo', 'Ríos']][S.fleteros.length % 3]; S.fleteros.push({ id: 'f' + (S.fleteros.length + 1), nombre: extra[0], apellido: extra[1], tel: '+54 11 6' + Math.floor(100 + Math.random() * 899) + '-' + Math.floor(1000 + Math.random() * 8999), email: extra[0].toLowerCase() + '@correo.com', licencia: { nro: 'B1-3' + Math.floor(1000000 + Math.random() * 8999999), vence: new Date(2029, 2, 1) }, vehiculo: { marca: 'Peugeot', modelo: 'Boxer', anio: 2022, patente: 'AH 5' + Math.floor(10 + Math.random() * 89) + ' ' + 'QR', tipo: 'Utilitario', cond: [] }, estado: 'PENDIENTE', alta: new Date(), nota: '' }); S.codigo = null; closeModal(); toast(`${extra[0]} ${extra[1]} ingresó el código y espera tu aprobación.`); render(); },
    'enviar-inv': () => { const m = $('#inv').value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) { $('#e-inv').textContent = 'Escribí un email válido.'; return; } S.invitaciones.push({ email: m, code: genCode(), vence: plus(new Date(), 72 * 60) }); closeModal(); toast(`Invitación enviada a ${m}. Vence en 72 horas.`); render(); },
    'del-inv': () => { S.invitaciones.splice(+el.dataset.i, 1); toast('Invitación cancelada: su código dejó de funcionar.'); render(); },
    aprobar: () => { const f = F(id); f.estado = 'ACTIVO'; toast(`${fname(f)} ya es parte de tu equipo.`); render(); },
    rechazar: () => { S.fleteros = S.fleteros.filter(x => x.id !== id); toast('Solicitud rechazada.'); location.hash = '#/fleteros'; render(); },
    nota: () => { F(id).nota = $('#nota').value; toast('Nota guardada.'); },
    desvincular: () => {
      const f = F(id);
      if (S.viajes.some(x => x.fletero === id && x.estado === 'EN_CURSO')) return toast(`${fname(f)} tiene un viaje en curso: no se puede desvincular ahora.`, 'err');
      const pend = S.viajes.filter(x => x.fletero === id && x.estado === 'PROGRAMADO');
      openModal(`<h2>Desvincular a ${esc(fname(f))}</h2><p class="muted" style="margin-top:0">${pend.length ? `Tiene ${plural(pend.length, 'viaje programado', 'viajes programados')}: van a quedar <b>sin fletero</b> hasta que les asignes a otra persona.` : 'No tiene viajes programados.'} Puede unirse a otra empresa.</p><div class="actions"><button class="btn btn-ghost" data-act="modal-x">Volver</button><button class="btn btn-danger" data-act="confirmar-desv" data-id="${id}">Desvincular</button></div>`);
    },
    'confirmar-desv': () => { S.viajes.filter(x => x.fletero === id && x.estado === 'PROGRAMADO').forEach(x => { x.fletero = null; x.audit.push({ t: new Date(), who: 'Laura Gómez', txt: `Desvinculó a ${fname(F(id))}: el viaje quedó sin fletero` }); }); F(id).estado = 'INACTIVO'; closeModal(); toast('Fletero desvinculado.'); location.hash = '#/fleteros'; render(); },
  };
  if (H[a]) H[a]();
});
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

render();
</script>
</body>
</html>
